name: Fix RAG module routing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-module-routing-rag.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/fix-module-routing-rag.py
      - name: Verify
        run: node --check api/chat.js
      - name: Commit
        run: |
          rm -f .github/workflows/fix-module-routing-rag.yml .github/scripts/fix-module-routing-rag.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js .github/workflows/fix-module-routing-rag.yml .github/scripts/fix-module-routing-rag.py
          git commit -m "Improve module routing for MRP areas and PM Fiori apps"
          git push origin main
