name: Fix Tavily admin identity detection

on:
  push:
    paths:
      - '.github/workflows/fix-tavily-admin-email.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch admin identity detection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Brain.jsx')
          s = p.read_text()
          old = "const isAdmin = isUnlimited || ADMIN_EMAILS.includes(session?.user?.email || '')"
          new = "const isAdmin = ['abhishek.ashish.de@gmail.com', ...ADMIN_EMAILS].includes((session?.user?.email || '').toLowerCase())"
          if old not in s:
              raise SystemExit('Expected admin detection line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Brain.jsx
          git commit -m "Use explicit admin email for Tavily A/B control"
          git push
