name: Cleanup Groq and verify Wani
on:
  push:
    paths:
      - '.github/scripts/cleanup_groq_and_verify_wani_v1.py'
      - '.github/workflows/cleanup-groq-and-verify-wani-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply provider cleanup and verify link lanes
        run: python3 .github/scripts/cleanup_groq_and_verify_wani_v1.py
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit runtime cleanup
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api lib src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean retired Groq models and preserve Verified Links lane'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
