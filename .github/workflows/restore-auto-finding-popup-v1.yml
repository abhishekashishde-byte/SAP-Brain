name: Restore automatic save-understanding popup v1
on:
  push:
    paths:
      - '.github/scripts/restore_auto_finding_popup_v1.py'
      - '.github/workflows/restore-auto-finding-popup-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/restore_auto_finding_popup_v1.py
      - name: Verify
        run: |
          grep -q "gpt-4o-mini" api/chat.js
          grep -q "SUGGEST FINDING" api/chat.js
          grep -q "if (msgs.length < 2) return" src/pages/Brain.jsx
          grep -q "Save this finding?" src/pages/Brain.jsx
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit application changes
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js src/pages/Brain.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore automatic save-understanding suggestions'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
