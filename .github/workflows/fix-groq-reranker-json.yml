name: Harden live Groq book reranker

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-groq-reranker-json.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/fix-groq-reranker-json.py
      - name: Verify syntax
        run: node --check api/chat.js
      - name: Commit hardened live reranker
        run: |
          rm -f .github/workflows/fix-groq-reranker-json.yml .github/scripts/fix-groq-reranker-json.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js .github/workflows/fix-groq-reranker-json.yml .github/scripts/fix-groq-reranker-json.py
          git commit -m "Harden Groq book reranker structured output"
          git push origin main
