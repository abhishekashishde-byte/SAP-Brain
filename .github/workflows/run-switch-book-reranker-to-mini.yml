name: Apply GPT-4o mini book reranker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-switch-book-reranker-to-mini.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/switch_book_reranker_to_mini.py
      - name: Verify
        run: |
          node --check api/chat.js
          grep -q "async function rerankBookChunksWithMini" api/chat.js
          grep -q "model: 'gpt-4o-mini'" api/chat.js
          grep -q "Candidates sent to GPT-4o mini reranker:" api/chat.js
      - name: Commit
        run: |
          rm -f .github/workflows/run-switch-book-reranker-to-mini.yml
          rm -f .github/workflows/switch-book-reranker-to-mini.yml
          rm -f .github/scripts/switch_book_reranker_to_mini.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js .github/workflows/run-switch-book-reranker-to-mini.yml .github/workflows/switch-book-reranker-to-mini.yml .github/scripts/switch_book_reranker_to_mini.py
          git commit -m "Switch book RAG reranker to GPT-4o mini"
          git push origin main
