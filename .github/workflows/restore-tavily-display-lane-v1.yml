name: Restore Tavily display lane v1
on:
  push:
    paths:
      - '.github/scripts/restore_tavily_display_lane_v1.py'
      - '.github/workflows/restore-tavily-display-lane-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Tavily display-lane fix
        run: python3 .github/scripts/restore_tavily_display_lane_v1.py
      - name: Verify lane separation
        run: |
          grep -q "const groundingSearchResults = selectedTavily.map" api/chat.js
          grep -q "const referenceSearchResults = tavilyCandidates.slice(0, 4)" api/chat.js
          grep -q "DISPLAY ONLY (NOT SENT TO SONNET)" api/chat.js
          grep -q "tavilyDisplayed" api/chat.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit application change
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore Tavily findings as Verified Links without grounding Sonnet'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
