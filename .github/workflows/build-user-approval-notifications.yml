name: Build Wani user approval and notifications
on:
  push:
    paths:
      - '.github/scripts/build_user_approval_notifications.py'
      - '.github/workflows/build-user-approval-notifications.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/build_user_approval_notifications.py
      - name: Syntax checks
        run: |
          node --check api/_auth.js
          node --check api/recall.js
          node --check api/reference-search.js
          node --check lib/adminDashboard.js
          node --check lib/emailNotifications.js
      - name: Verify feature anchors
        run: |
          grep -q "admin_approve_user" api/recall.js
          grep -q "notifyQuotaReached" api/reference-search.js
          grep -q "Pending approval" src/pages/AdminDashboard.jsx
          grep -q "notify_login" src/App.jsx
          grep -q "notify_signup" src/pages/Login.jsx
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/_auth.js api/recall.js api/reference-search.js lib/adminDashboard.js src/App.jsx src/pages/AdminDashboard.jsx src/pages/Login.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add admin approvals and user email notifications'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
