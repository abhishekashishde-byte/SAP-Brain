name: Apply correction routing fix

on:
  push:
    paths:
      - '.github/workflows/apply-pushback-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply changes
        run: python3 .github/scripts/fix_pushback_architecture.py
      - name: Check changes
        run: |
          grep -q "PUSHBACK / RE-VERIFICATION MODE" api/chat.js
          grep -q "knowledgeForPrompt" api/chat.js
          grep -q "strongCodeSyntax" api/chat.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Save changes
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden correction and pushback verification routing'
          git push origin HEAD:main
