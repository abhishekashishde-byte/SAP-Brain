name: Retry correction routing fix

on:
  push:
    paths:
      - '.github/workflows/retry-pushback-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_pushback_architecture.py
      - run: |
          grep -q "PUSHBACK / RE-VERIFICATION MODE" api/chat.js
          grep -q "knowledgeForPrompt" api/chat.js
          grep -q "strongCodeSyntax" api/chat.js
          npm install --no-audit --no-fund
          npm run build
      - run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden correction and pushback verification routing'
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
