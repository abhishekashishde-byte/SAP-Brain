name: Fix Tavily A/B server-confirmed admin status

on:
  push:
    paths:
      - '.github/workflows/fix-tavily-server-admin-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch admin status flow
        shell: python
        run: |
          from pathlib import Path

          brain = Path('src/pages/Brain.jsx')
          s = brain.read_text()
          old = """  const ADMIN_EMAILS = [import.meta.env.VITE_ADMIN_EMAIL_1, import.meta.env.VITE_ADMIN_EMAIL_2].filter(Boolean)\n  const isAdmin = ['abhishek.ashish.de@gmail.com', ...ADMIN_EMAILS].includes((session?.user?.email || '').toLowerCase())\n  // Private admin experiment; OFF by default to avoid accidental double Sonnet spend.\n  const [tavilyABMode, setTavilyABMode] = useState(false)\n"""
          new = """  // Admin identity is confirmed by the authenticated backend, not by Vite/client env vars.\n  const [serverIsAdmin, setServerIsAdmin] = useState(false)\n  const isAdmin = serverIsAdmin\n  useEffect(() => {\n    const token = session?.access_token\n    if (!token) { setServerIsAdmin(false); return }\n    let cancelled = false\n    fetch('/api/chat', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },\n      body: JSON.stringify({ action: 'admin_status' }),\n    })\n      .then(r => r.ok ? r.json() : Promise.reject(new Error('admin status failed')))\n      .then(data => { if (!cancelled) setServerIsAdmin(data?.isAdmin === true) })\n      .catch(() => { if (!cancelled) setServerIsAdmin(false) })\n    return () => { cancelled = true }\n  }, [session?.access_token])\n  // Private admin experiment; OFF by default to avoid accidental double Sonnet spend.\n  const [tavilyABMode, setTavilyABMode] = useState(false)\n"""
          if old not in s:
              raise SystemExit('Brain.jsx target block not found; refusing blind patch')
          brain.write_text(s.replace(old, new, 1))

          chat = Path('api/chat.js')
          c = chat.read_text()
          old2 = """  // ── ADMIN EMAIL CHECK ─────────────────────────────────────────────────────\n  const ADMIN_EMAILS = [process.env.ADMIN_EMAIL_1, process.env.ADMIN_EMAIL_2].filter(Boolean)\n  const isAdmin = ADMIN_EMAILS.includes(userEmail)\n\n  // ── ACTIONS: generate_visual — on-demand only, triggered by the \"View as\n"""
          new2 = """  // ── ADMIN EMAIL CHECK ─────────────────────────────────────────────────────\n  // Server is the single source of truth for admin-only controls and A/B execution.\n  const ADMIN_EMAILS = [process.env.ADMIN_EMAIL_1, process.env.ADMIN_EMAIL_2, 'abhishek.ashish.de@gmail.com']\n    .filter(Boolean).map(e => e.toLowerCase())\n  const isAdmin = ADMIN_EMAILS.includes((userEmail || '').toLowerCase())\n\n  if (body.action === 'admin_status') {\n    return res.status(200).json({ isAdmin })\n  }\n\n  // ── ACTIONS: generate_visual — on-demand only, triggered by the \"View as\n"""
          if old2 not in c:
              raise SystemExit('api/chat.js target block not found; refusing blind patch')
          chat.write_text(c.replace(old2, new2, 1))

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Brain.jsx api/chat.js
          git diff --cached --check
          git commit -m "Use backend-confirmed admin status for Tavily A/B control"
          git push origin main
