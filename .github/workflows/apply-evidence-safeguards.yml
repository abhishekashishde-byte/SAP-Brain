name: Apply evidence safeguards

on:
  push:
    paths:
      - '.github/workflows/apply-evidence-safeguards.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_pushback_remaining.py
      - run: |
          grep -q "PUSHBACK / RE-VERIFICATION MODE" api/chat.js
          grep -q "knowledgeForPrompt" api/chat.js
          npm install --no-audit --no-fund
          npm run build
      - run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete evidence safeguards'
          git push origin HEAD:main
