name: Fix shared prompt syntax
on:
  push:
    paths:
      - '.github/scripts/fix_shared_prompt_syntax.py'
      - '.github/workflows/fix-shared-prompt-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply syntax fix
        run: python3 .github/scripts/fix_shared_prompt_syntax.py
      - name: Syntax check
        run: node --check api/_shared.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit fix
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/_shared.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix shared prompt template literal syntax'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
