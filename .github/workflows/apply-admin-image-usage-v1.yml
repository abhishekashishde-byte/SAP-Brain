name: Apply admin image usage v1
on:
  push:
    paths:
      - '.github/scripts/add_admin_image_usage_v1.py'
      - '.github/workflows/apply-admin-image-usage-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/add_admin_image_usage_v1.py
      - name: Verify
        run: |
          grep -q "Images generated" src/pages/AdminDashboard.jsx
          grep -q "customerBriefs" lib/adminDashboard.js
          grep -q "consultantNotes" lib/adminDashboard.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add src/pages/AdminDashboard.jsx lib/adminDashboard.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show image usage per user in admin dashboard'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
