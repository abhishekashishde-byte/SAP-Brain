name: Apply book RAG reranker

on:
  push:
    branches: [admin]
    paths:
      - '.github/workflows/apply-book-reranker.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin
      - name: Apply book reranking patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/chat.js')
          text = path.read_text()

          marker = "// ── 7. BOOK RAG — fetch relevant SAP book chunks from pgvector ────────────────\n"
          if marker not in text:
              raise SystemExit('book rag marker not found')

          helper = r'''// ── BOOK RAG RERANKING / DEDUPLICATION ───────────────────────────────────────
// pgvector remains the broad candidate retriever. This second-stage reranker is deliberately
// narrow: it scores relevance to the exact question and flags true repetition. It never
// rewrites book content or decides SAP correctness. Any Groq failure returns the current
// pgvector candidates unchanged, so this optimisation cannot remove evidence on error.
function normalizeBookChunkForDedupe(value) {
  return String(value || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim()
    .replace(/\s+/g, ' ')
}

function getBookChunkText(chunk) {
  return chunk?.content || chunk?.chunk_text || chunk?.text || ''
}

function removeExactBookDuplicates(chunks) {
  const unique = []
  const seen = new Set()
  let removed = 0
  for (const chunk of chunks || []) {
    const key = normalizeBookChunkForDedupe(getBookChunkText(chunk))
    if (key && seen.has(key)) { removed++; continue }
    if (key) seen.add(key)
    unique.push(chunk)
  }
  return { unique, removed }
}

async function rerankBookChunksWithGroq(question, chunks) {
  if (!Array.isArray(chunks) || chunks.length <= 1 || !process.env.GROQ_API_KEY) return chunks || []

  const controller = new AbortController()
  const timeout = setTimeout(() => controller.abort(), 2500)
  try {
    const compact = chunks.map((c, i) => {
      const title = c.title || c.book_title || c.doc_name || c.source || 'Unknown book'
      const page = c.page || c.page_number || c.page_num || ''
      const body = getBookChunkText(c).slice(0, 1200)
      return `CHUNK ${i}\nBOOK: ${title}\nPAGE: ${page}\nTEXT: ${body}`
    }).join('\n\n')

    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.GROQ_API_KEY}` },
      body: JSON.stringify({
        model: 'openai/gpt-oss-20b',
        temperature: 0,
        max_tokens: 500,
        messages: [{
          role: 'user',
          content: `You are a conservative reranker for SAP book excerpts. The user's exact question is:\n\n${question}\n\nFor each chunk below, score ONLY how directly useful the excerpt is for answering that exact question. Do not judge whether SAP facts are true and do not add outside knowledge.\n\nScore:\n5 = directly answers the exact question or contains a decisive fact needed for it\n4 = clearly same SAP object/process and materially useful\n3 = related context but not enough to answer the question\n2 = same broad module but mostly tangential\n1 = unrelated to the actual question\n\nAlso set duplicate_of to another chunk index ONLY when this chunk repeats essentially the same useful factual content and contributes no meaningful extra condition, exception, scope, app/t-code, or outcome. Similar topic is NOT a duplicate.\n\nReturn ONLY valid JSON in this exact shape:\n{"ratings":[{"index":0,"score":5,"duplicate_of":null}]}\n\n${compact}`
        }]
      })
    })
    if (!response.ok) {
      console.log('[BOOK RERANK] Groq HTTP', response.status, '— keeping pgvector candidates')
      return chunks
    }

    const data = await response.json()
    const raw = data.choices?.[0]?.message?.content?.trim() || '{}'
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim())
    const ratings = Array.isArray(parsed.ratings) ? parsed.ratings : []
    if (!ratings.length) return chunks

    const valid = new Map()
    for (const r of ratings) {
      const index = Number(r.index)
      const score = Number(r.score)
      const duplicateOf = r.duplicate_of == null ? null : Number(r.duplicate_of)
      if (Number.isInteger(index) && index >= 0 && index < chunks.length && Number.isFinite(score) && score >= 1 && score <= 5) {
        valid.set(index, { score, duplicateOf: Number.isInteger(duplicateOf) ? duplicateOf : null })
      }
    }
    if (!valid.size) return chunks

    const ranked = chunks.map((chunk, index) => ({ chunk, index, ...(valid.get(index) || { score: 1, duplicateOf: null }) }))
      .filter(item => !(item.duplicateOf != null && item.duplicateOf >= 0 && item.duplicateOf < chunks.length))
      .sort((a, b) => b.score - a.score || a.index - b.index)

    let kept = ranked.filter(item => item.score >= 4).slice(0, 4)
    // Conservative fallback: if nothing is strong, keep the single best borderline chunk.
    if (!kept.length && ranked[0]?.score === 3) kept = [ranked[0]]

    console.log('[BOOK RERANK]', JSON.stringify({
      candidates: chunks.length,
      ratings: ranked.map(r => ({ index: r.index, score: r.score, duplicateOf: r.duplicateOf })),
      kept: kept.map(r => r.index),
    }))
    return kept.map(item => item.chunk)
  } catch (err) {
    console.log('[BOOK RERANK] Groq skipped:', err.name === 'AbortError' ? 'timeout' : err.message, '— keeping pgvector candidates')
    return chunks
  } finally {
    clearTimeout(timeout)
  }
}

'''

          if 'async function rerankBookChunksWithGroq(question, chunks)' not in text:
              text = text.replace(marker, helper + marker, 1)

          old = r'''    if (error) { console.error('[BOOK RAG] Error:', error.message); return [] }

    console.log('[BOOK RAG] Chunks found:', data?.length || 0, '| module filter:', detectedModule || 'none')
    return data || []'''

          new = r'''    if (error) { console.error('[BOOK RAG] Error:', error.message); return [] }

    const candidates = data || []
    const { unique: exactUnique, removed: exactRemoved } = removeExactBookDuplicates(candidates)
    const reranked = await rerankBookChunksWithGroq(question, exactUnique)
    console.log('[BOOK RAG] Candidates:', candidates.length, '| exact duplicates removed:', exactRemoved, '| chunks kept:', reranked.length, '| module filter:', detectedModule || 'none')
    return Object.assign(reranked, { _bookRerankMeta: { candidates: candidates.length, exactRemoved, kept: reranked.length } })'''

          if old not in text:
              if new not in text:
                  raise SystemExit('book return block not found')
          else:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify syntax
        run: node --check api/chat.js
      - name: Commit patched application
        shell: bash
        run: |
          rm -f .github/workflows/apply-book-reranker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js .github/workflows/apply-book-reranker.yml
          git commit -m "Add Groq reranking for book RAG chunks"
          git push origin admin
