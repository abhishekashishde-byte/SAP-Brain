name: Apply book RAG reranker

on:
  push:
    branches:
      - admin
    paths:
      - '.github/workflows/apply-book-reranker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin
      - name: Apply patch
        run: python3 .github/scripts/patch-book-rerank.py
      - name: Verify syntax
        run: node --check api/chat.js
      - name: Commit patched application
        run: |
          rm -f .github/workflows/apply-book-reranker.yml .github/scripts/patch-book-rerank.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js .github/workflows/apply-book-reranker.yml .github/scripts/patch-book-rerank.py
          git commit -m "Add Groq reranking for book RAG chunks"
          git push origin admin
