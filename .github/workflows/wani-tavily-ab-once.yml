name: Apply Tavily A-B experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wani-tavily-ab-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/install_tavily_ab.py
      - name: Verify backend syntax
        run: node --check api/chat.js
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Verify experiment anchors
        run: |
          grep -q "tavilyABTest" api/chat.js
          grep -q "B — WITHOUT Tavily" api/chat.js
          grep -q "Tavily A/B:" src/pages/Brain.jsx
          grep -q "_abDebugDocWithoutTavily" src/pages/Brain.jsx
      - name: Commit
        run: |
          rm -f .github/workflows/wani-tavily-ab-once.yml
          rm -f .github/scripts/install_tavily_ab.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js src/pages/Brain.jsx .github/workflows/wani-tavily-ab-once.yml .github/scripts/install_tavily_ab.py
          git commit -m "Add admin Tavily A/B comparison mode"
          git push origin main
