name: Finalize smart evidence routing

on:
  push:
    paths:
      - '.github/workflows/implement-smart-evidence-routing.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Move evidence helper out of API directory
        run: |
          mkdir -p lib
          git mv api/evidence-routing.js lib/evidence-routing.js
          sed -i "s#'./evidence-routing.js'#'../lib/evidence-routing.js'#" api/chat.js

      - name: Verify routing implementation
        run: |
          ! grep -n "runTavilyAB\|tavilyABTest\|WANI TAVILY A/B DEBUG\|A — WITH Tavily\|B — WITHOUT Tavily" api/chat.js src/pages/Brain.jsx
          grep -n "assessEvidenceRouting\|answerSearchResults\|referenceSearchResults" api/chat.js
          grep -n "RAG/KB score\|Tavily sent to Sonnet\|EVIDENCE QUALITY / ROUTING" api/chat.js
          test ! -f api/evidence-routing.js
          test -f lib/evidence-routing.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit final implementation
        run: |
          git config user.name "wani-maintenance"
          git config user.email "wani-maintenance@users.noreply.github.com"
          git add -A
          git commit -m "Finalize dynamic evidence routing for Vercel"
          git push origin HEAD:main
