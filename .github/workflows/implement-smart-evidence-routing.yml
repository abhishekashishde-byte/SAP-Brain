name: Implement smart evidence routing

on:
  push:
    paths:
      - '.github/workflows/implement-smart-evidence-routing.yml'
      - '.github/scripts/implement-smart-evidence-routing.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Wani evidence routing
        run: python .github/scripts/implement-smart-evidence-routing.py

      - name: Verify A/B path is gone
        run: |
          ! grep -n "runTavilyAB\|tavilyABTest\|WANI TAVILY A/B DEBUG\|A — WITH Tavily\|B — WITHOUT Tavily" api/chat.js src/pages/Brain.jsx
          grep -n "EVIDENCE QUALITY / ROUTING\|RAG/KB score\|Tavily sent to Sonnet" api/chat.js
          grep -n "assessEvidenceRouting\|answerSearchResults\|referenceSearchResults" api/chat.js

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "wani-maintenance"
          git config user.email "wani-maintenance@users.noreply.github.com"
          git add api/chat.js api/evidence-routing.js src/pages/Brain.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement dynamic RAG and Tavily evidence routing"
          git push origin HEAD:main
