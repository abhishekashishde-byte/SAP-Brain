name: Fix login and history v1
on:
  push:
    paths:
      - '.github/scripts/fix_login_history_v1.py'
      - '.github/workflows/fix-login-history-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply login/history patch
        run: python3 .github/scripts/fix_login_history_v1.py
      - name: Verify history/admin wiring
        run: |
          grep -q "CONVERSATION_LIST_FIELDS" src/supabaseClient.js
          grep -q "export const loadConversation" src/supabaseClient.js
          grep -q "loadConversation(activeConvId" src/pages/Brain.jsx
          grep -q "\[session?.user?.id\]" src/pages/Brain.jsx
          grep -q "action: 'admin_status'" src/App.jsx
          if grep -A8 "Ask the server whether this verified user is an administrator" src/App.jsx | grep -q "admin_dashboard"; then
            echo "App still uses heavy admin_dashboard for identity check" >&2
            exit 1
          fi
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit application changes
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add src/supabaseClient.js src/pages/Brain.jsx src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix slow login history and admin detection'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
