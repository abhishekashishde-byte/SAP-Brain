name: Add book rerank debug audit

on:
  push:
    branches:
      - admin
    paths:
      - '.github/workflows/add-book-rerank-debug.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin
      - name: Apply audit patch
        run: python3 scripts/patch-book-rerank-debug.py
      - name: Verify syntax
        run: node --check api/chat.js
      - name: Commit patched application
        run: |
          rm -f .github/workflows/add-book-rerank-debug.yml scripts/patch-book-rerank-debug.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js .github/workflows/add-book-rerank-debug.yml scripts/patch-book-rerank-debug.py
          git commit -m "Expose book reranker decisions in debug output"
          git push origin admin
