name: Fix intro video v3
on:
  push:
    paths:
      - '.github/scripts/fix_intro_video_v3.py'
      - '.github/workflows/fix-intro-video-v3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_intro_video_v3.py
      - name: Verify isolated change
        run: |
          grep -q "showIntroVideo" src/pages/Brain.jsx
          grep -q "onEnded={()=>setShowIntroVideo(false)}" src/pages/Brain.jsx
          test "$(grep -c 'source src=\"/wani-intro.mp4\"' src/pages/Brain.jsx)" -eq 1
          grep -q "messages.length===0 && showIntroVideo" src/pages/Brain.jsx
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit application change
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add src/pages/Brain.jsx
          git commit -m 'Fix intro video playback independently of history loading'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
