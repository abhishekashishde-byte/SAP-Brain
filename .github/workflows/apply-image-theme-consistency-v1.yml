name: Apply image theme consistency v1
on:
  push:
    paths:
      - '.github/scripts/apply_image_theme_consistency_v1.py'
      - '.github/workflows/apply-image-theme-consistency-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_image_theme_consistency_v1.py')
          s = p.read_text()
          old = "brain = replace_once(brain, \"const branded = await addExactWaniBranding(data.imageBase64)\", \"const branded = await addExactWaniBranding(data.imageBase64, activeThemeKey)\", 'handout branding theme')"
          new = "needle = \"const branded = await addExactWaniBranding(data.imageBase64)\"\nif brain.count(needle) != 2:\n    raise SystemExit(f'handout branding theme: expected 2 pre-theme branding calls, found {brain.count(needle)}')\nbrain = brain.replace(needle, \"const branded = await addExactWaniBranding(data.imageBase64, activeThemeKey)\", 1)"
          if old not in s:
              raise SystemExit('branding matcher line not found in patch script')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/scripts/apply_image_theme_consistency_v1.py
      - name: Verify theme wiring
        run: |
          grep -q "activeThemeKey" src/pages/Brain.jsx
          grep -q "_customerBriefTheme" src/pages/Brain.jsx
          grep -q "_handoutTheme" src/pages/Brain.jsx
          grep -q "IMAGE_THEME_PROFILES" api/chat.js
          grep -q "MANDATORY WANI THEME" api/chat.js
          grep -q "Consultant Note" src/quotaVisualGuard.js
          grep -q "generate_handout" api/reference-search.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit application changes
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add src/pages/Brain.jsx api/chat.js src/quotaVisualGuard.js api/reference-search.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Wani image outputs follow selected theme'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
