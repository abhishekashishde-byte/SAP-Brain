name: Apply white enterprise image art direction
on:
  push:
    paths:
      - '.github/scripts/apply_image_theme_consistency_v1.py'
      - '.github/workflows/apply-image-theme-consistency-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply white dense visual patch
        run: python3 .github/scripts/apply_image_theme_consistency_v1.py
      - name: Verify visual art direction
        run: |
          node --check api/chat.js
          grep -q "WHITE ENTERPRISE CUSTOMER BRIEF" api/chat.js
          grep -q "WHITE ENTERPRISE CONSULTANT NOTE" api/chat.js
          grep -q "75-90%" api/chat.js
          grep -q "no purple/red/dark full-canvas backgrounds" api/chat.js
          grep -q "themeKey = 'light'" api/chat.js
          grep -q ": 'light'" api/chat.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit application changes
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Wani visuals white and information-dense'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
