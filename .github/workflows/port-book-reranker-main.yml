name: Port book reranker to live main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-book-reranker-main.yml'

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply only reranker application patches
        run: |
          git fetch origin admin
          git show b16e5d672e327c7ab71582723620697aa4ebf945 -- api/chat.js | git apply -3
          git show 7de3e77849e36770a269f06df6fc079901083f65 -- api/chat.js | git apply -3
      - name: Verify syntax
        run: node --check api/chat.js
      - name: Commit live patch
        run: |
          rm -f .github/workflows/port-book-reranker-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js .github/workflows/port-book-reranker-main.yml
          git commit -m "Port Groq book reranker and audit debug to live product"
          git push origin main
