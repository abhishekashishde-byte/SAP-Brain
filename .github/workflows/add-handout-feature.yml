name: Add Wani handout feature

on:
  push:
    paths:
      - '.github/workflows/add-handout-feature.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch feature
        run: python3 .github/scripts/add_handout_feature.py

      - name: Verify feature
        run: |
          grep -q "generateHandoutOnDemand" api/chat.js
          grep -q "body.action === 'generate_handout'" api/chat.js
          grep -q "function OnDemandHandout" src/pages/Brain.jsx
          grep -q "addExactWaniBranding" src/pages/Brain.jsx
          grep -q "Create Handout" src/pages/Brain.jsx

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit implementation
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js src/pages/Brain.jsx
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
            exit 0
          fi
          git commit -m 'Add optional handwritten Wani handouts'
          git push origin HEAD:main
