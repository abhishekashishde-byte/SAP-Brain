name: Fix Wani correction routing

on:
  push:
    paths:
      - '.github/workflows/add-handout-feature.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply correction routing fix
        run: python3 .github/scripts/fix_pushback_routing.py
      - name: Verify
        run: |
          grep -q "hasStrongCodePayload" api/chat.js
          grep -q "Correction turns inherit the SAP Q&A path" api/chat.js
          grep -q "r.support >= 0.70" lib/evidence-routing.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit implementation
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js lib/evidence-routing.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden correction and pushback evidence routing'
          git push origin HEAD:main
