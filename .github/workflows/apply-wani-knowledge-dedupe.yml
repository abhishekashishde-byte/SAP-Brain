name: Apply Wani knowledge dedupe

on:
  push:
    branches:
      - admin
    paths:
      - '.github/workflows/apply-wani-knowledge-dedupe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin
      - name: Apply patch
        run: python3 scripts/apply_knowledge_dedupe_patch.py
      - name: Verify syntax
        run: node --check api/chat.js
      - name: Commit patched application
        run: |
          rm -f .github/workflows/apply-wani-knowledge-dedupe.yml scripts/apply_knowledge_dedupe_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/chat.js .github/workflows/apply-wani-knowledge-dedupe.yml scripts/apply_knowledge_dedupe_patch.py
          git commit -m "Add safe AI-assisted finding deduplication"
          git push origin admin
