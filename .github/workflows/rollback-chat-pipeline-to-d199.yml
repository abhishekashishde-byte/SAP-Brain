name: Roll back chat pipeline to d199
on:
  push:
    paths:
      - '.github/scripts/rollback_chat_pipeline_to_d199.py'
      - '.github/workflows/rollback-chat-pipeline-to-d199.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good answer pipeline only
        run: python3 .github/scripts/rollback_chat_pipeline_to_d199.py
      - name: Verify rollback boundaries
        run: |
          grep -q "mergeVerifiedReferences" api/chat.js
          ! grep -q "STRICT DIRECT-EVIDENCE GATE" api/chat.js
          ! grep -q "llama-3.3-70b-versatile" api/chat.js
          git diff --exit-code -- middleware.js api/categorise.js src || true
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit rollback
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore last known-good Wani answer pipeline'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
