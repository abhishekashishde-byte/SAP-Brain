name: Fix verified links v1
on:
  push:
    paths:
      - '.github/scripts/fix_verified_links_v1.py'
      - '.github/workflows/fix-verified-links-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply isolated links patch
        run: python3 .github/scripts/fix_verified_links_v1.py
      - name: Verify links behavior
        run: |
          grep -q "function mergeVerifiedReferences" api/chat.js
          grep -q "references: finalVerifiedReferences" api/chat.js
          grep -q "const displayReferences" src/pages/Brain.jsx
          grep -q "references={displayReferences}" src/pages/Brain.jsx
          grep -q "showIntroVideo" src/pages/Brain.jsx
          grep -q "CONVERSATION_LIST_FIELDS" src/supabaseClient.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit application change
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js src/pages/Brain.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore verified links from retrieved SAP sources'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
