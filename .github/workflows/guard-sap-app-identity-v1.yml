name: Guard SAP app identity v1
on:
  push:
    paths:
      - '.github/scripts/guard_sap_app_identity_v1.py'
      - '.github/workflows/guard-sap-app-identity-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply app identity guard
        run: python3 .github/scripts/guard_sap_app_identity_v1.py
      - name: Verify guard
        run: |
          grep -q "SAP APP IDENTITY VERIFICATION" api/_shared.js
          grep -q "app name ↔ app ID ↔ technology" api/_shared.js
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit application changes
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/_shared.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Require exact SAP app identity verification'
          for i in 1 2 3; do git push origin HEAD:main && break || sleep 5; done
