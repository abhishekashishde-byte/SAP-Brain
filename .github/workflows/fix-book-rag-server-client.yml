name: Fix Book RAG shared corpus retrieval
on:
  push:
    paths:
      - '.github/scripts/fix_book_rag_server_client.py'
      - '.github/workflows/fix-book-rag-server-client.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Book RAG repair
        run: python3 .github/scripts/fix_book_rag_server_client.py
      - name: Verify Book RAG architecture
        run: |
          grep -q "const bookClient = getSupabase()" api/chat.js
          grep -q "bookClient.rpc('match_sap_book_chunks'" api/chat.js
          grep -q "'EQUIPMENT', 'EQUIPMENT MASTER', 'IH08', 'IE03', 'IE05'" api/chat.js
          ! grep -A12 "async function fetchBookChunks" api/chat.js | grep -q "const userClient = createClient"
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit runtime repair
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/chat.js
          git commit -m 'Fix Book RAG retrieval from shared corpus'
          git push origin HEAD:main
