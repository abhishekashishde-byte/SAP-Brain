name: Strengthen Wani consultant truth and links

on:
  push:
    paths:
      - '.github/workflows/strengthen-consultant-truth-and-links-v1.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply consultant truth and link repair
        run: python3 .github/scripts/strengthen_consultant_truth_and_links_v1.py

      - name: Validate patch markers
        run: |
          grep -q "TRUTH OVER AGREEMENT" api/_shared.js
          grep -q "USER DISAGREEMENT IS NOT EVIDENCE" api/chat.js
          grep -q "compactSapSearchKeywords" api/chat.js
          grep -q "https://www.google.com/search?q=" api/chat.js
          grep -q "links are product output" api/reference-search.js

      - name: Syntax checks
        run: |
          node --check api/_shared.js
          node --check api/chat.js
          node --check api/reference-search.js

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Save changes
        run: |
          git config user.name 'wani-maintenance'
          git config user.email 'wani-maintenance@users.noreply.github.com'
          git add api/_shared.js api/chat.js api/reference-search.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Wani evidence-led under pushback and restore useful links'
          git push origin HEAD:main
